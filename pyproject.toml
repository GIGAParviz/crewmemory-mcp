[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewmemory-mcp"
version = "0.3.0"
description = "Shared crew memory MCP server for AI coding agents (Claude Code, Codex, Cursor, ...)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Parviz", email = "GIGAParviz@users.noreply.github.com" }]
keywords = ["mcp", "memory", "ai-agents", "codex", "claude", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "mcp>=2.0.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/GIGAParviz/crewmemory-mcp"
Repository = "https://github.com/GIGAParviz/crewmemory-mcp"
Issues = "https://github.com/GIGAParviz/crewmemory-mcp/issues"
Changelog = "https://github.com/GIGAParviz/crewmemory-mcp/blob/main/CHANGELOG.md"

[project.scripts]
crewmemory = "crewmemory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crewmemory"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md", "/pyproject.toml"]
